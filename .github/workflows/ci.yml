name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run backend tests
        run: npm test --if-present
        working-directory: ./backend

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run lint
        run: npm run lint
        working-directory: ./frontend

      - name: Build Next.js
        run: npm run build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: /api

  docker-build-and-push:
    name: Docker Build, Scan & GHCR Publish
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend Build, Scan & Push ---
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build Backend Image (Local for scan)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}/backend:ci-test

      - name: Scan Backend Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:ci-test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # --- Frontend Build & Push ---
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build & Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Previous deployment script kept for reference:
          # script: |
          #   cd ~/ai-meal-planner
          #   echo "Pulling latest Docker images..."
          #   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
          #   echo "Starting updated containers..."
          #   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
          #   docker ps
          #   echo "Checking backend health..."
          #   curl -f http://localhost:5000/health
          #   echo "Deployment successful!"

          script: |
            cd ~/ai-meal-planner

            echo "Retrieving production secrets from AWS Secrets Manager..."

            SECRET_JSON="$(aws secretsmanager get-secret-value \
              --secret-id ai-meal-planner/production \
              --region ap-south-1 \
              --query SecretString \
              --output text)"

            export JWT_SECRET="$(echo "$SECRET_JSON" | jq -r '.JWT_SECRET')"
            export GEMINI_API_KEY="$(echo "$SECRET_JSON" | jq -r '.GEMINI_API_KEY')"

            if [ -z "$JWT_SECRET" ] || [ "$JWT_SECRET" = "null" ]; then
              echo "ERROR: JWT_SECRET was not retrieved"
              exit 1
            fi

            if [ -z "$GEMINI_API_KEY" ] || [ "$GEMINI_API_KEY" = "null" ]; then
              echo "ERROR: GEMINI_API_KEY was not retrieved"
              exit 1
            fi

            echo "Production secrets retrieved successfully."

            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting updated containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Checking running containers..."
            docker ps

            echo "Checking backend health..."
            curl -f http://localhost:5000/health

            echo "Deployment successful!"
